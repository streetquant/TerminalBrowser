[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termdeck"
version = "0.1.31"
description = "Lightweight browser-like terminal task manager with hidden tmux sessions and Terminator theme import."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "TermDeck contributors"}]
keywords = ["terminal", "tmux", "gtk", "vte", "terminator", "codex", "process-manager"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Shells",
  "Topic :: Terminals :: Terminal Emulators/X Terminals"
]
dependencies = []

[project.scripts]
termdeck = "termdeck.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["termdeck*"]
