[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t1000"
version = "0.2.18"
description = "The terminal manager that never breaks down — named after the T-1000 from Terminator 2."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "TermDeck contributors"}]
keywords = ["terminal", "tmux", "gtk", "vte", "t1000", "codex", "process-manager"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Shells",
  "Topic :: Terminals :: Terminal Emulators/X Terminals"
]
dependencies = []

[project.scripts]
t1000 = "termdeck.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["termdeck*"]

[tool.setuptools.package-data]
termdeck = ["_build_info.json"]
