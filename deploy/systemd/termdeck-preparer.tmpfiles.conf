# Install as /usr/lib/tmpfiles.d/termdeck-preparer.conf after the sysusers file.
# The producer parent and runtime are private to termdeck-preparer.  The z rule
# only normalizes an existing migrated/generated recovery key; it never creates
# empty or predictable key material.  The max-owned consumer tree is
# deliberately absent here so tmpfiles cannot take ownership of user state,
# sessions, authentication, releases, binaries, or service runtime.
d /var/lib/termdeck-preparer 0700 termdeck-preparer termdeck-preparer -
d /var/lib/termdeck-preparer/runtime 0700 termdeck-preparer termdeck-preparer -
z /var/lib/termdeck-preparer/.termdeck-tls-recovery-key 0600 termdeck-preparer termdeck-preparer -
d /etc/termdeck 0755 root root -
d /etc/termdeck/control 0710 root termdeck-preparer -
d /etc/termdeck/control/records 0700 root root -
