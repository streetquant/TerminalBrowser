# Install as /usr/lib/tmpfiles.d/termdeck-preparer.conf after the sysusers file.
# The installer must atomically bootstrap the recovery-key leaf with 32 random
# bytes before enabling the broker socket.  The z rule only fixes an existing
# leaf's ownership/mode; it never creates empty or predictable key material.
# Each daemon owns its socket lifecycle.
d /var/lib/termdeck-preparer 0700 termdeck-preparer termdeck-preparer -
d /warp/runtime/termdeck/termdeck-lan 0700 termdeck-preparer termdeck-preparer -
z /warp/runtime/termdeck/.termdeck-tls-recovery-key 0600 termdeck-preparer termdeck-preparer -
d /etc/termdeck 0755 root root -
d /etc/termdeck/control 0710 root termdeck-preparer -
d /etc/termdeck/control/records 0700 root root -
