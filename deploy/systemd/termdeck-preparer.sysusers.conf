# Install as /usr/lib/sysusers.d/termdeck-preparer.conf.
# A `u` entry is password-disabled by systemd-sysusers; nologin also blocks
# non-password login paths.  The explicit primary group keeps this principal
# separate from the interactive max account.
g termdeck-preparer -
u termdeck-preparer -:termdeck-preparer "TermDeck runtime preparer" /var/lib/termdeck-preparer /usr/bin/nologin
