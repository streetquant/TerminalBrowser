worker_processes 2;
worker_shutdown_timeout 5s;
pid /warp/projects/softwares/termdeck/.termdeck/nginx/nginx.pid;
error_log /warp/projects/softwares/termdeck/.termdeck/nginx/logs/error.log notice;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types_hash_max_size 2048;

    map $host $termdeck_host_allowed {
        default 0;
        include /warp/projects/softwares/termdeck/.termdeck/nginx/allowed-hosts.map;
    }

    # Connection-peer admission for the qualified LAN and local cloudflared.
    # Forwarded client headers never select a trusted origin peer. This is an
    # HTTP/control boundary, not TCP filtering or proof of router NAT policy.
    geo $remote_addr $termdeck_origin_peer_allowed {
        default 0;
        127.0.0.1/32 1;
        192.168.1.0/24 1;
    }

    map $http_upgrade $termdeck_connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Validate browser provenance before translating headers for the loopback
    # backend. Safe navigation may omit Origin; mutations and WSS may not.
    map "$request_method:$http_upgrade" $termdeck_request_kind {
        default mutation;
        ~^(GET|HEAD|OPTIONS):$ safe;
        "GET:websocket" websocket;
    }

    map $http_origin $termdeck_external_origin {
        default $http_origin;
        '' "$scheme://$http_host";
    }

    map "$termdeck_request_kind:$http_origin" $termdeck_missing_origin {
        default 0;
        "mutation:" 1;
        "websocket:" 1;
    }

    map "$termdeck_request_kind:$http_sec_fetch_site" $termdeck_fetch_site_allowed {
        default 0;
        ~^safe: 1;
        "mutation:same-origin" 1;
        "websocket:same-origin" 1;
        # Native WebSocket clients may omit Fetch Metadata, but still need an
        # exact Origin. Explicit cross-site/same-site metadata is refused.
        "websocket:" 1;
    }

    log_format termdeck escape=json
        '{"time":"$time_iso8601","connection":"$connection",'
        '"requests":"$connection_requests","remote":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
        '"upstream_status":"$upstream_status","upgrade":"$http_upgrade",'
        '"bytes_sent":$bytes_sent,"request_length":$request_length}';
    access_log /warp/projects/softwares/termdeck/.termdeck/nginx/logs/access.log termdeck buffer=64k flush=5s;

    client_body_temp_path /warp/projects/softwares/termdeck/.termdeck/nginx/temp/client 1 2;
    proxy_temp_path /warp/projects/softwares/termdeck/.termdeck/nginx/temp/proxy 1 2;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75s;
    keepalive_requests 10000;
    reset_timedout_connection on;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    ssl_session_cache shared:TermDeckSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    upstream termdeck_backend {
        server 127.0.0.1:7391;
        keepalive 64;
    }

    server {
        listen 0.0.0.0:7443 ssl;
        server_name _;

        # Run before location redirects as well as static/proxied responses.
        if ($termdeck_origin_peer_allowed = 0) { return 403; }
        if ($termdeck_host_allowed = 0) { return 421; }
        if ($termdeck_external_origin != "$scheme://$http_host") { return 421; }
        if ($termdeck_missing_origin = 1) { return 403; }
        if ($termdeck_fetch_site_allowed = 0) { return 403; }

        ssl_certificate /warp/projects/softwares/termdeck/.termdeck/tls/server-chain.crt;
        ssl_certificate_key /warp/projects/softwares/termdeck/.termdeck/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;

        client_max_body_size 2m;
        client_body_timeout 30s;
        client_header_timeout 30s;
        send_timeout 86400s;

        location = /_termdeck/bootstrap {
            allow 127.0.0.1;
            allow 192.168.1.0/24;
            deny all;
            alias /warp/projects/softwares/termdeck/.termdeck/bootstrap.html;
            default_type text/html;
            add_header Cache-Control 'no-store' always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options 'nosniff' always;
            add_header Referrer-Policy 'no-referrer' always;
        }

        location = /_termdeck/lan-ca.crt {
            alias /warp/projects/softwares/termdeck/.termdeck/tls/ca.crt;
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="termdeck-lan-ca.crt"' always;
            add_header Cache-Control 'no-store' always;
        }

        location = /t1000 {
            absolute_redirect off;
            return 308 /t1000/;
        }

        # Stable Cloudflare path. The proxy strips /t1000 before routing and
        # emits an exact trusted prefix contract so redirects, forms, assets,
        # APIs and WSS URLs remain under maxchat.semiotech.org/t1000.
        location ^~ /t1000/ {
            rewrite ^/t1000(/.*)$ $1 break;
            proxy_http_version 1.1;
            proxy_pass http://termdeck_backend;
            proxy_set_header Host 127.0.0.1:7391;
            proxy_set_header Origin http://127.0.0.1:7391;
            proxy_set_header Sec-Fetch-Site same-origin;
            proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
            proxy_set_header X-Forwarded-Prefix /t1000;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $termdeck_connection_upgrade;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
            proxy_connect_timeout 5s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_next_upstream off;
            proxy_cookie_flags termdeck_session secure httponly samesite=strict;
            proxy_cookie_flags termdeck_csrf secure samesite=strict;
        }

        location ^~ /_termdeck/ws/ {
            proxy_http_version 1.1;
            proxy_pass http://termdeck_backend;
            proxy_set_header Host 127.0.0.1:7391;
            proxy_set_header Origin http://127.0.0.1:7391;
            proxy_set_header Sec-Fetch-Site same-origin;
            proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
            proxy_connect_timeout 5s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_next_upstream off;
            proxy_cookie_flags termdeck_session secure httponly samesite=strict;
            proxy_cookie_flags termdeck_csrf secure samesite=strict;
        }

        location / {
            proxy_http_version 1.1;
            proxy_pass http://termdeck_backend;
            proxy_set_header Host 127.0.0.1:7391;
            proxy_set_header Origin http://127.0.0.1:7391;
            proxy_set_header Sec-Fetch-Site same-origin;
            proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_socket_keepalive on;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_next_upstream off;
            proxy_cookie_flags termdeck_session secure httponly samesite=strict;
            proxy_cookie_flags termdeck_csrf secure samesite=strict;
        }
    }
}
