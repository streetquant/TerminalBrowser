worker_processes 1;
pid /8tb/projects/softwares/termdeck/.runtime/termdeck-lan/nginx/nginx.pid;
error_log /8tb/projects/softwares/termdeck/.runtime/termdeck-lan/nginx/logs/error.log notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /8tb/projects/softwares/termdeck/.runtime/termdeck-lan/nginx/temp/client;
    proxy_temp_path /8tb/projects/softwares/termdeck/.runtime/termdeck-lan/nginx/temp/proxy;

    server {
        listen 192.168.1.10:7443 ssl;
        server_name 192.168.1.10;

        if ($host != "192.168.1.10") { return 421; }

        ssl_certificate /8tb/projects/softwares/termdeck/.runtime/termdeck-lan/tls/server-chain.crt;
        ssl_certificate_key /8tb/projects/softwares/termdeck/.runtime/termdeck-lan/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TermDeckSSL:1m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        client_max_body_size 4k;
        client_body_timeout 15s;
        send_timeout 60s;

        location = /_termdeck/bootstrap {
            allow 192.168.1.5;
            deny all;
            alias /8tb/projects/softwares/termdeck/.runtime/termdeck-lan/bootstrap.html;
            default_type text/html;
            add_header Cache-Control 'no-store' always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options 'nosniff' always;
            add_header Referrer-Policy 'no-referrer' always;
        }

        location = /_termdeck/lan-ca.crt {
            alias /8tb/projects/softwares/termdeck/.runtime/termdeck-lan/tls/ca.crt;
            default_type application/x-x509-ca-cert;
            add_header Content-Disposition 'attachment; filename="termdeck-lan-ca.crt"' always;
            add_header Cache-Control 'no-store' always;
        }

        # RFC 6455 requires explicit hop-by-hop Upgrade forwarding. Keep this
        # isolated from ordinary HTTP so terminal streams stay open without
        # disabling request reuse for snapshots and static assets.
        location ^~ /_termdeck/ws/ {
            proxy_http_version 1.1;
            proxy_pass http://127.0.0.1:7391;
            proxy_set_header Host 127.0.0.1:7391;
            proxy_set_header Origin http://127.0.0.1:7391;
            proxy_set_header Sec-Fetch-Site same-origin;
            proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_cookie_flags termdeck_session secure httponly samesite=strict;
            proxy_cookie_flags termdeck_csrf secure samesite=strict;
        }

        location / {
            proxy_http_version 1.1;
            proxy_pass http://127.0.0.1:7391;
            proxy_set_header Host 127.0.0.1:7391;
            proxy_set_header Origin http://127.0.0.1:7391;
            proxy_set_header Sec-Fetch-Site same-origin;
            proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering on;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_cookie_flags termdeck_session secure httponly samesite=strict;
            proxy_cookie_flags termdeck_csrf secure samesite=strict;
        }
    }
}
