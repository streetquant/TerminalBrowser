[workspace]
members = [
    "crates/termdeck-web-auth",
    "crates/termdeck-web-core",
    "crates/termdeck-web-state",
    "crates/termdeck-web-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["t1000 contributors"]

[workspace.dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
getrandom = { version = "0.4.3", default-features = false }
rusqlite = { version = "0.40.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "net", "process", "rt", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"
