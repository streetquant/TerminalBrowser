name: CI

on:
  push:
  pull_request:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m compileall -q termdeck tests scripts
      - name: CLI smoke
        run: |
          python -m termdeck workspace-plan --sample > /tmp/termdeck.workspace.json
          python -m termdeck workspace-plan /tmp/termdeck.workspace.json
          python -m termdeck palette master --db :memory:
          python -m termdeck sessions --db :memory:

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gir1.2-gtk-3.0 \
            gir1.2-vte-2.91 \
            python3-gi \
            python3-pip \
            python3-venv
      - name: Install TermDeck with system GTK bindings
        run: |
          python3 -m venv --system-site-packages .venv-gtk
          .venv-gtk/bin/python -m pip install --upgrade pip
          .venv-gtk/bin/python -m pip install pytest -e .
      - name: Full test suite
        env:
          NO_AT_BRIDGE: '1'
        run: .venv-gtk/bin/python -m pytest tests -q

  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK and visual-smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus-x11 \
            gir1.2-gtk-3.0 \
            gir1.2-vte-2.91 \
            imagemagick \
            python3-gi \
            python3-pip \
            python3-venv \
            tmux \
            x11-utils \
            xdotool \
            xvfb
      - name: Install TermDeck with system GTK bindings
        run: |
          python3 -m venv --system-site-packages .venv-ui
          .venv-ui/bin/python -m pip install --upgrade pip
          .venv-ui/bin/python -m pip install -e .
      - name: Verify terminal-first Tabs pane lifecycle
        run: >-
          xvfb-run -a dbus-run-session --
          .venv-ui/bin/python scripts/check_tabs_pane_smoke.py
      - name: Verify every remembered window restores
        run: >-
          xvfb-run -a dbus-run-session --
          .venv-ui/bin/python scripts/check_window_restore_smoke.py
      - name: Verify Tab Manager window relocation
        run: >-
          xvfb-run -a dbus-run-session --
          .venv-ui/bin/python scripts/check_tab_manager_move_smoke.py
      - name: Verify minimal header chrome
        run: >-
          xvfb-run -a dbus-run-session --
          .venv-ui/bin/python scripts/check_header_smoke.py
      - name: Verify minimal tab strip
        run: >-
          xvfb-run -a dbus-run-session --
          .venv-ui/bin/python scripts/check_tab_strip_smoke.py
      - name: Verify typo-tolerant Search Tabs
        run: >-
          xvfb-run -a dbus-run-session --
          .venv-ui/bin/python scripts/check_fuzzy_search_smoke.py
      - name: Verify startup terminal geometry
        run: >-
          xvfb-run -a dbus-run-session --
          .venv-ui/bin/python scripts/check_startup_geometry_smoke.py
      - name: Verify Ctrl+W and Ctrl+Q lifecycle
        run: >-
          xvfb-run -a dbus-run-session --
          .venv-ui/bin/python scripts/check_shortcut_lifecycle_smoke.py
      - name: Verify Ctrl+Shift+V clipboard paste
        run: >-
          xvfb-run -a dbus-run-session --
          .venv-ui/bin/python scripts/check_clipboard_paste_smoke.py
      - name: Verify terminal select-to-copy
        run: >-
          xvfb-run -a dbus-run-session --
          .venv-ui/bin/python scripts/check_terminal_select_copy_smoke.py
      - name: Verify immediate Ctrl+T tab creation
        run: >-
          xvfb-run -a dbus-run-session --
          .venv-ui/bin/python scripts/check_immediate_new_tab_smoke.py
      - name: Verify polished visual hierarchy
        run: >-
          xvfb-run -a dbus-run-session --
          .venv-ui/bin/python scripts/check_visual_polish_smoke.py
      - name: Verify wheel scrolling never becomes TUI key input
        run: >-
          xvfb-run -a dbus-run-session --
          .venv-ui/bin/python scripts/check_terminal_scroll_smoke.py
      - name: Render desktop GTK layout
        run: .venv-ui/bin/python scripts/render_ui_smoke.py --output termdeck-ui-smoke-desktop.png
      - name: Render compact GTK layout
        run: >-
          .venv-ui/bin/python scripts/render_ui_smoke.py
          --output termdeck-ui-smoke-compact.png
          --window-width 640
          --window-height 520
      - name: Upload rendered UI frames
        uses: actions/upload-artifact@v7
        with:
          name: termdeck-ui-smoke
          path: termdeck-ui-smoke-*.png
          if-no-files-found: error
          retention-days: 7
