name: CI

on:
  push:
  pull_request:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m compileall -q termdeck tests scripts
      - name: CLI smoke
        run: |
          python -m termdeck templates codex
          python -m termdeck workspace-plan --sample > /tmp/termdeck.workspace.json
          python -m termdeck workspace-plan /tmp/termdeck.workspace.json
          python -m termdeck palette master --db :memory:
          python -m termdeck sessions --db :memory:

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gir1.2-gtk-3.0 \
            gir1.2-vte-2.91 \
            python3-gi \
            python3-pip \
            python3-venv
      - name: Install TermDeck with system GTK bindings
        run: |
          python3 -m venv --system-site-packages .venv-gtk
          .venv-gtk/bin/python -m pip install --upgrade pip
          .venv-gtk/bin/python -m pip install pytest -e .
      - name: Full test suite
        env:
          NO_AT_BRIDGE: '1'
        run: .venv-gtk/bin/python -m pytest tests -q

  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK and visual-smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus-x11 \
            gir1.2-gtk-3.0 \
            gir1.2-vte-2.91 \
            imagemagick \
            python3-gi \
            python3-pip \
            python3-venv \
            tmux \
            x11-utils \
            xdotool \
            xvfb
      - name: Install TermDeck with system GTK bindings
        run: |
          python3 -m venv --system-site-packages .venv-ui
          .venv-ui/bin/python -m pip install --upgrade pip
          .venv-ui/bin/python -m pip install -e .
      - name: Render desktop GTK layout
        run: .venv-ui/bin/python scripts/render_ui_smoke.py --output termdeck-ui-smoke-desktop.png
      - name: Render compact GTK layout
        run: >-
          .venv-ui/bin/python scripts/render_ui_smoke.py
          --output termdeck-ui-smoke-compact.png
          --window-width 640
          --window-height 520
      - name: Upload rendered UI frames
        uses: actions/upload-artifact@v7
        with:
          name: termdeck-ui-smoke
          path: termdeck-ui-smoke-*.png
          if-no-files-found: error
          retention-days: 7
