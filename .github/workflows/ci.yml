name: ci

on:
  push:
  pull_request:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package without optional GUI bindings
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .
      - name: Compile and check CLI compatibility
        run: |
          PYTHONPYCACHEPREFIX=/tmp/termdeck-compat-pycache .venv/bin/python -m compileall -q termdeck tests scripts
          .venv/bin/t1000 version
      - name: Validate authoritative inventory contract
        run: |
          rm -rf /tmp/termdeck-manifest-${{ matrix.python-version }}
          .venv/bin/python scripts/run_validation.py \
            --check-manifest \
            --profile ci \
            --output /tmp/termdeck-manifest-${{ matrix.python-version }}

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK/VTE, terminal and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus-x11 \
            gir1.2-gtk-3.0 \
            gir1.2-vte-2.91 \
            libgtk-3-0 \
            libvte-2.91-0 \
            python3-gi \
            python3-pytest \
            tmux \
            xdotool \
            xvfb
          python3 -m venv --system-site-packages .venv-gtk
          .venv-gtk/bin/python -m pip install --upgrade pip
          .venv-gtk/bin/python -m pip install -e .
      - name: Run every test file in a bounded fresh process
        run: |
          rm -rf validation-tests
          .venv-gtk/bin/python scripts/run_validation.py \
            --profile ci \
            --tests-only \
            --output validation-tests
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-tests
          path: validation-tests
          if-no-files-found: error

  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK/VTE, tmux, X11 and D-Bus smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus-x11 \
            gir1.2-gtk-3.0 \
            gir1.2-vte-2.91 \
            libgtk-3-0 \
            libvte-2.91-0 \
            python3-gi \
            python3-pytest \
            tmux \
            xdotool \
            xvfb
          python3 -m venv --system-site-packages .venv-gtk
          .venv-gtk/bin/python -m pip install --upgrade pip
          .venv-gtk/bin/python -m pip install -e .
      - name: Run the complete portable smoke inventory
        run: |
          rm -rf validation-smokes
          .venv-gtk/bin/python scripts/run_validation.py \
            --profile ci \
            --smokes-only \
            --output validation-smokes
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-smokes
          path: validation-smokes
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - name: Install pinned frontend build dependencies
        run: npm ci --ignore-scripts --prefix web/frontend
      - name: Check terminal layout and listener lifecycle
        run: npm test --prefix web/frontend
      - name: Verify reproducible embedded terminal assets
        run: |
          npm run build --prefix web/frontend
          git diff --exit-code -- \
            web/crates/termdeck-web-server/assets/terminal.js \
            web/crates/termdeck-web-server/assets/terminal.css \
            web/crates/termdeck-web-server/assets/terminal-assets.json

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e .
      - name: Enforce headless model performance budgets
        run: |
          .venv/bin/python scripts/perf_probe.py --sessions 100 --iterations 200 --assert-thresholds
